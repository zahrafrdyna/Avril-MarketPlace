<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toko Kopi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h3>TokoKopi</h3>
        <nav>
            <a href="#produk">produk</a>
            <a href="#kontak">kontak</a>
            <a href="#">keranjang (<span id="cart">0</span>) </a>
        </nav>
    </header>
    <main>
        <div class="card-container">
        <div class="card">
            <img src="Kopi Mahal.jpg" alt="">
            <h3>Kopi YA!</h3>
            <p>Rp. 15.000.000</p>
            <div class="tambah-kuantitas">
                <button class="qty-min">-</button>
                <input type="text" value="0" readonly class="qty-value">
                <button class="qty-plus">+</button>
            </div>
            <button class="button-beli">Beli Sekarang</button>
        </div>
        <div class="card">
            <img src="kopi susu.jpeg" alt="">
            <h3>Kopi Susu</h3>
            <p>Rp. 10.000.000</p>
            <div class="tambah-kuantitas">
                <button class="qty-min">-</button>
                <input type="text" value="0" readonly class="qty-value">
                <button class="qty-plus">+</button>
            </div>
            <button class="button-beli">Beli Sekarang</button>
        </div>
         <div class="card">
            <img src="Kopi Hitam.jpg" alt="">
            <h3>Kopi Hitam</h3>
            <p>Rp. 12.000.000</p>
            <div class="tambah-kuantitas">
                <button class="qty-min">-</button>
                <input type="text" value="0" readonly class="qty-value">
                <button class="qty-plus">+</button>
            </div>
            <button class="button-beli">Beli Sekarang</button>
        </div>
         <div class="card">
            <img src="Kopi Luwak.jpg" alt="">
            <h3>Kopi Luwak</h3>
            <p>Rp. 18.000.000</p>
            <div class="tambah-kuantitas">
              <button class="qty-min">-</button>
                <input type="text" value="0" readonly class="qty-value">
                <button class="qty-plus">+</button>
            </div>
            <button class="button-beli">Beli Sekarang</button>
        </div>
         <div class="card">
            <img src="Kopi Cappucino.jpg" alt="">
            <h3>Kopi Cappucino</h3>
            <p>Rp. 20.000.000</p>
            <div class="tambah-kuantitas">
              <button class="qty-min">-</button>
                <input type="text" value="0" readonly class="qty-value">
                <button class="qty-plus">+</button>
            </div>
            <button class="button-beli">Beli Sekarang</button>
         </div>
         <div class="card">
            <img src="Kopi Espresso.jpg" alt="">
            <h3>Kopi Espresso</h3>
            <p>Rp. 17.000.000</p>
            <div class="tambah-kuantitas">
              <button class="qty-min">-</button>
                <input type="text" value="0" readonly class="qty-value">
                <button class="qty-plus">+</button>
            </div>
            <button class="button-beli">Beli Sekarang</button>
        </div>
    </div>
    </main>
    <footer>
        <div>
            <h3>Hubungi Saya</h3>
            <form class="kontak">
                <label for="nama">Nama Lengkap</label>
                <input type="text" placeholder="Full Name">
                <label for="email">Email</label>
                <input type="email" placeholder="123@gmail.com" id="email">
                <label for="pesan">Pesan</label>
                <textarea name="pesan" id="pesan"></textarea>
                <button type="button">Kirim Pesan</button>
            </form>
        </div>
        <h5>Lyra Avrilla 2026</h5>
    </footer>
    <script src="script.js"></script>
</body>
</html>
